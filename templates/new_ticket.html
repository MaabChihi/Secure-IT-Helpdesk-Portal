{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Report an issue</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Title <input type="text" name="title" maxlength="100" required></label>
        <label>Category
            <select name="category">
                {% for c in categories %}<option>{{ c }}</option>{% endfor %}
            </select>
        </label>
        <label>Priority
            <select name="priority">
                {% for p in priorities %}<option>{{ p }}</option>{% endfor %}
            </select>
        </label>
        <label>Description <textarea name="description" rows="6" required></textarea></label>
        <button type="submit">Submit ticket</button>
    </form>
</div>
{% endblock %}
